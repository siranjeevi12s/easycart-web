# Netlify serves the Vite build; ALL /api traffic proxies to the Azure backend
# (the portal uses a relative /api baseURL, so without this every data call 404s).
[[redirects]]
  from = "/api/*"
  to = "https://easycart-g6end7e0c8hkhwe4.eastasia-01.azurewebsites.net/api/:splat"
  status = 200
  force = true
